name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: |
          npm install

      - name: Bundle html5-qrcode for offline camera scan
        run: |
          set -e
          if [ ! -f www/html5-qrcode.min.js ]; then
            echo "Downloading html5-qrcode into www/ (offline camera scan)"
            curl -fsSL "https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" -o www/html5-qrcode.min.js
          fi
          wc -c www/html5-qrcode.min.js
          python3 << 'PY'
from pathlib import Path
import re
p = Path("www/billing.html")
t = p.read_text(encoding="utf-8")
if 'inject("html5-qrcode.min.js")' in t:
    print("billing.html already prefers local html5-qrcode")
elif 'unpkg.com/html5-qrcode' in t:
    pattern = r"function loadHtml5Qrcode\(\)\{[\s\S]*?return html5Loading;\s*\}"
    new_fn = '''function loadHtml5Qrcode(){
    if(window.Html5Qrcode) return Promise.resolve(window.Html5Qrcode);
    if(html5Loading) return html5Loading;
    function inject(src){
      return new Promise(function(resolve,reject){
        var s=document.createElement("script");
        s.src=src; s.async=true;
        var done=false;
        var timer=setTimeout(function(){ if(done)return; done=true; try{s.remove();}catch(e){} reject(new Error("Scanner script timeout")); }, 12000);
        s.onload=function(){ if(done)return; done=true; clearTimeout(timer); if(window.Html5Qrcode) resolve(window.Html5Qrcode); else reject(new Error("Html5Qrcode missing")); };
        s.onerror=function(){ if(done)return; done=true; clearTimeout(timer); reject(new Error("Could not load "+src)); };
        document.head.appendChild(s);
      });
    }
    html5Loading=inject("html5-qrcode.min.js").catch(function(){ return inject("https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"); }).catch(function(err){ html5Loading=null; throw err; });
    return html5Loading;
  }'''
    t2, n = re.subn(pattern, new_fn, t, count=1)
    if n:
        p.write_text(t2, encoding="utf-8")
        print("Patched billing.html loadHtml5Qrcode to local-first")
    else:
        print("WARN: loadHtml5Qrcode pattern not found")
else:
    print("No CDN html5-qrcode reference found")
PY

      - name: Ensure complete Android platform
        run: |
          set -e
          NEED_RECREATE=0
          if [ ! -d android ]; then
            echo "android/ missing"
            NEED_RECREATE=1
          elif [ ! -f android/gradlew ]; then
            echo "android/gradlew missing — incomplete platform"
            NEED_RECREATE=1
          elif [ ! -f android/settings.gradle ] && [ ! -f android/settings.gradle.kts ]; then
            echo "android settings.gradle missing — incomplete platform"
            NEED_RECREATE=1
          elif [ ! -d android/app/src/main ]; then
            echo "android/app/src/main missing — incomplete platform"
            NEED_RECREATE=1
          fi

          if [ "$NEED_RECREATE" = "1" ]; then
            echo "Recreating full Capacitor Android platform..."
            rm -rf android
            npx cap add android
          else
            echo "android/ looks complete — keeping existing platform"
          fi

          npx cap sync android
          test -f android/gradlew
          chmod +x android/gradlew
          echo "Platform ready:"
          ls -la android/gradlew
          test -f android/app/src/main/AndroidManifest.xml
          echo "Manifest exists"

      - name: Patch CAMERA permission + MainActivity
        run: |
          set -e
          chmod +x scripts/patch-camera-android.sh
          bash scripts/patch-camera-android.sh

      - name: Build debug APK
        run: |
          set -e
          cd android
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: orbitbills-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
