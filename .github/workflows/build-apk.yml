name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Bundle html5-qrcode offline
        run: |
          set -e
          mkdir -p www
          if [ ! -f www/html5-qrcode.min.js ]; then
            curl -fsSL "https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" -o www/html5-qrcode.min.js
          fi
          wc -c www/html5-qrcode.min.js
          if [ -f www/billing.html ] && grep -q 'unpkg.com/html5-qrcode' www/billing.html; then
            sed -i 's|https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js|html5-qrcode.min.js|g' www/billing.html
            echo "billing.html: scanner src -> local html5-qrcode.min.js"
          fi

      - name: Ensure complete Android platform
        run: |
          set -e
          NEED_RECREATE=0
          if [ ! -d android ]; then NEED_RECREATE=1
          elif [ ! -f android/gradlew ]; then NEED_RECREATE=1
          elif [ ! -f android/settings.gradle ] && [ ! -f android/settings.gradle.kts ]; then NEED_RECREATE=1
          elif [ ! -d android/app/src/main ]; then NEED_RECREATE=1
          fi
          if [ "$NEED_RECREATE" = "1" ]; then
            echo "Recreating Capacitor Android platform..."
            rm -rf android
            npx cap add android
          fi
          npx cap sync android
          test -f android/gradlew
          chmod +x android/gradlew
          test -f android/app/src/main/AndroidManifest.xml

      - name: Patch CAMERA permission + MainActivity
        run: |
          set -e
          chmod +x scripts/patch-camera-android.sh
          bash scripts/patch-camera-android.sh

      - name: Build debug APK
        run: |
          set -e
          cd android
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: orbitbills-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
