name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: |
          npm install

      # Partial android/ (only Manifest + MainActivity, no Gradle) breaks `cap sync`.
      # Always ensure a complete Capacitor Android platform before sync/build.
      - name: Ensure complete Android platform
        run: |
          set -e
          NEED_RECREATE=0
          if [ ! -d android ]; then
            echo "android/ missing"
            NEED_RECREATE=1
          elif [ ! -f android/gradlew ]; then
            echo "android/gradlew missing — incomplete platform"
            NEED_RECREATE=1
          elif [ ! -f android/settings.gradle ] && [ ! -f android/settings.gradle.kts ]; then
            echo "android settings.gradle missing — incomplete platform"
            NEED_RECREATE=1
          fi

          if [ "$NEED_RECREATE" = "1" ]; then
            echo "Recreating full Capacitor Android platform..."
            rm -rf android
            npx cap add android
          fi

          npx cap sync android
          test -f android/gradlew
          chmod +x android/gradlew
          ls -la android/gradlew

      - name: Patch CAMERA permission + MainActivity
        run: |
          set -e
          chmod +x scripts/patch-camera-android.sh
          bash scripts/patch-camera-android.sh

      - name: Build debug APK
        run: |
          set -e
          cd android
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: orbitbills-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
